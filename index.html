<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlamByCampus | Mobile Salon UCC</title>
  <style>
    :root {
      --primary: #e91e63;
      --dark: #1a1a1a;
      --light-bg: #fff5f8;
      --white: #ffffff;
      --border: #dddddd;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: var(--light-bg);
      color: var(--dark);
      padding-bottom: 70px;
    }

    header {
      background: var(--white);
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary);
    }

    .banner {
      background: var(--primary);
      color: var(--white);
      text-align: center;
      padding: 8px;
      font-size: 0.85rem;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
    }

    .page-section {
      display: none;
    }

    .page-section.active {
      display: block;
    }

    .card {
      background: var(--white);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0.5rem 0 0.2rem;
    }

    .card-price {
      color: var(--primary);
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .btn {
      background: var(--primary);
      color: var(--white);
      border: none;
      padding: 0.7rem;
      border-radius: 5px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-green {
      background: #25D366;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 0.9rem;
    }

    /* Bottom Navigation */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--white);
      display: flex;
      border-top: 1px solid var(--border);
      height: 60px;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      font-weight: bold;
      color: #666;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="banner">📍 UCC Campus Mobile Doorstep Salon</div>

  <header>
    <div class="logo">GlamByCampus UCC 🇬🇭</div>
  </header>

  <div class="container">
    <!-- SECTION 1: SERVICES -->
    <div id="sec-services" class="page-section active">
      <h2 style="margin-bottom: 1rem;">Services & Pricing</h2>
      
      <div class="card">
        <img src="https://images.unsplash.com/photo-1607748862156-7c548e7e98f4?auto=format&fit=crop&w=500&q=80" alt="Knotless Braids">
        <div class="card-title">Knotless Braids</div>
        <div class="card-price">GH₵ 180.00</div>
        <button class="btn" type="button" onclick="goToBooking('Knotless Braids (GH₵ 180)')">Book This Service</button>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=500&q=80" alt="Wig Install">
        <div class="card-title">Wig Install & Plucking</div>
        <div class="card-price">GH₵ 120.00</div>
        <button class="btn" type="button" onclick="goToBooking('Wig Install (GH₵ 120)')">Book This Service</button>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1519014816548-bf5fe059798b?auto=format&fit=crop&w=500&q=80" alt="Nails Set">
        <div class="card-title">Acrylic Nails Full Set</div>
        <div class="card-price">GH₵ 100.00</div>
        <button class="btn" type="button" onclick="goToBooking('Acrylic Nails (GH₵ 100)')">Book This Service</button>
      </div>
    </div>

    <!-- SECTION 2: PORTFOLIO -->
    <div id="sec-portfolio" class="page-section">
      <h2 style="margin-bottom: 1rem;">Work Showcase</h2>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1607748862156-7c548e7e98f4?auto=format&fit=crop&w=500&q=80" alt="Braids Showcase">
        <div class="card-title">Jumbo Braids Work</div>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1519014816548-bf5fe059798b?auto=format&fit=crop&w=500&q=80" alt="Nails Showcase">
        <div class="card-title">Custom Acrylic Nails Work</div>
      </div>
    </div>

    <!-- SECTION 3: BOOKING -->
    <div id="sec-booking" class="page-section">
      <h2 style="margin-bottom: 1rem;">Book Appointment</h2>
      <div class="card">
        <form id="bookingForm">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="custName" required placeholder="Enter your name">
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="custPhone" required placeholder="024XXXXXXX">
          </div>

          <div class="form-group">
            <label>UCC Campus Hostel / Location</label>
            <select id="custLocation" required>
              <option value="">-- Select Location --</option>
              <option value="Oguaa Hall">Oguaa Hall</option>
              <option value="ATL Hall">ATL Hall</option>
              <option value="Casford Hall">Casford Hall</option>
              <option value="Adehye Hall">Adehye Hall</option>
              <option value="Valco Hall">Valco Hall</option>
              <option value="SSNIT Hostels">SSNIT Hostels</option>
              <option value="Amamoma">Amamoma Area</option>
              <option value="Kwaprow">Kwaprow Area</option>
            </select>
          </div>

          <div class="form-group">
            <label>Service Selected</label>
            <select id="custService" required>
              <option value="Knotless Braids (GH₵ 180)">Knotless Braids (GH₵ 180)</option>
              <option value="Wig Install (GH₵ 120)">Wig Install (GH₵ 120)</option>
              <option value="Acrylic Nails (GH₵ 100)">Acrylic Nails (GH₵ 100)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Preferred Date & Time</label>
            <input type="datetime-local" id="custDate" required>
          </div>

          <div class="form-group">
            <label>Room Number / Notes</label>
            <textarea id="custNotes" rows="2" placeholder="e.g. Room 201"></textarea>
          </div>

          <button type="submit" class="btn btn-green">Send Order via WhatsApp</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="nav-bar">
    <button class="nav-btn active" id="btn-services" onclick="showTab('services')">Services</button>
    <button class="nav-btn" id="btn-portfolio" onclick="showTab('portfolio')">Projects</button>
    <button class="nav-btn" id="btn-booking" onclick="showTab('booking')">Book</button>
  </div>

  <script>
    // REPLACE WITH CLIENT'S WHATSAPP NUMBER (Ghana country code + number, e.g., 233241234567)
    var OWNER_PHONE = "233574347482";

    function showTab(tabName) {
      document.getElementById('sec-services').className = "page-section";
      document.getElementById('sec-portfolio').className = "page-section";
      document.getElementById('sec-booking').className = "page-section";

      document.getElementById('btn-services').className = "nav-btn";
      document.getElementById('btn-portfolio').className = "nav-btn";
      document.getElementById('btn-booking').className = "nav-btn";

      document.getElementById('sec-' + tabName).className = "page-section active";
      document.getElementById('btn-' + tabName).className = "nav-btn active";
      window.scrollTo(0, 0);
    }

    function goToBooking(serviceName) {
      document.getElementById('custService').value = serviceName;
      showTab('booking');
    }

    document.getElementById('bookingForm').onsubmit = function(e) {
      e.preventDefault();

      var name = document.getElementById('custName').value;
      var phone = document.getElementById('custPhone').value;
      var location = document.getElementById('custLocation').value;
      var service = document.getElementById('custService').value;
      var date = document.getElementById('custDate').value;
      var notes = document.getElementById('custNotes').value || "None";

      var msg = "NEW SALON BOOKING\n" +
                "Name: " + name + "\n" +
                "Phone: " + phone + "\n" +
                "Location: " + location + "\n" +
                "Service: " + service + "\n" +
                "Date/Time: " + date + "\n" +
                "Notes: " + notes;

      var whatsappUrl = "https://wa.me/" + OWNER_PHONE + "?text=" + encodeURIComponent(msg);
      window.open(whatsappUrl, "_blank");
    };
  </script>
</body>
</html>
